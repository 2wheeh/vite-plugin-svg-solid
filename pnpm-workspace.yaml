packages:
  - '.'
  - tests/fixtures/*

autoInstallPeers: false
strictPeerDependencies: true

# Keep compiler/runtime pairs exact while testing prereleases. A caret can
# otherwise silently pull a newer RC into an older compatibility fixture.
overrides:
  '@solidjs/vite-plugin@3.0.0-next.33>@dom-expressions/compiler': 0.50.0-next.44
  '@solidjs/vite-plugin@3.0.0-next.33>babel-preset-solid': 2.0.0-rc.2
  '@solidjs/vite-plugin@3.0.0-next.44>@solidjs/compiler': 2.0.0-rc.9
  '@solidjs/vite-plugin@3.0.0-next.44>@solidjs/babel-plugin': 2.0.0-rc.9
  '@solidjs/vite-plugin@3.0.0-next.46>@solidjs/compiler': 2.0.0-rc.10
  '@solidjs/vite-plugin@3.0.0-next.46>@solidjs/babel-plugin': 2.0.0-rc.10
  'solid-js@2.0.0-rc.2>@solidjs/signals': 2.0.0-rc.2
  'solid-js@2.0.0-rc.9>@solidjs/signals': 2.0.0-rc.9
  'solid-js@2.0.0-rc.10>@solidjs/signals': 2.0.0-rc.10
